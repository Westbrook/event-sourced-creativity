<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slideshow PDF visual fidelity fixture</title>
    <link rel="stylesheet" href="/src/styles.css">
    <style>
      body { margin: 0; padding: 32px; background: #d9ddd9; }
      main { width: 960px; }
      [hidden] { display: none !important; }
      forma-presentation-slide { width: 960px; height: 540px; }
      forma-presentation-deck .presentation-deck-list { gap: 24px; padding: 0; }
      forma-presentation-deck .presentation-deck-list > li { gap: 0; }
      forma-presentation-deck .presentation-deck-list > li > details { display: none; }
      #controls { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      #status { font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <forma-presentation-slide></forma-presentation-slide>
      <forma-presentation-deck id="deck" hidden></forma-presentation-deck>
      <div id="controls">
        <button id="export" type="button">Export visual fidelity fixture</button>
        <output id="status">Ready</output>
      </div>
      <textarea id="pdf-output" hidden readonly></textarea>
    </main>
    <script type="module" src="/tests/presentation-pdf.fixture.mjs"></script>
  </body>
</html>
