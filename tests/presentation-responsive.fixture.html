<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive presentation acceptance fixture</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/design-system.css">
    <link rel="stylesheet" href="/src/responsive-foundation.css">
    <style>
      html,body { inline-size: 100%; block-size: 100%; margin: 0; overflow: hidden; }
      #viewer { box-sizing: border-box; display: grid; inline-size: 100%; block-size: 100dvh; max-inline-size: none; max-block-size: none; margin: 0; border: 0; border-radius: 0; }
      #viewer > .document-artifact-reader { block-size: 100%; max-block-size: 100%; }
      #viewer forma-presentation-deck { min-inline-size: 0; min-block-size: 0; }
      #preview { display: grid; inline-size: min(365px,100dvi); align-content: start; }
      #shared { inline-size: 100%; block-size: 100dvh; overflow: auto; }
      #preview[hidden],#viewer[hidden],#shared[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <section id="viewer" class="document-artifact-view" data-artifact-kind="slides" data-output-focus="false">
      <article class="document-artifact-reader">
        <header class="artifact-viewer-header">
          <div class="artifact-viewer-identity">
            <div class="artifact-viewer-kicker"><span>Slides</span><p class="artifact-review-status artifact-review-approved">Approved</p></div>
            <h2>Responsive acceptance</h2>
          </div>
          <div class="document-artifact-reader-actions">
            <button id="focus" class="icon-button artifact-viewer-focus-toggle" type="button" aria-label="Focus view" aria-pressed="false">⤢</button>
            <button class="icon-button" type="button" aria-label="Close">×</button>
          </div>
        </header>
        <div class="document-artifact-reader-content artifact-reader-slides">
          <forma-presentation-deck id="deck" preference-key="responsive-acceptance"></forma-presentation-deck>
        </div>
        <footer data-actions-open="false"><span>2 slides · Approved</span><button class="button ghost compact artifact-viewer-actions-toggle" type="button" aria-label="More actions">…</button><div><button class="button secondary compact" type="button">Review</button></div></footer>
      </article>
    </section>
    <section id="preview" class="document-artifacts compact" hidden>
      <div class="artifact-slide-preview"><forma-presentation-slide id="thumbnail"></forma-presentation-slide></div>
    </section>
    <section id="shared" hidden></section>
    <script type="module" src="/tests/presentation-responsive.fixture.mjs"></script>
  </body>
</html>
