<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Still · Media layout review</title></head><body>
<script type="module">
import {html,LitElement} from '/node_modules/lit/index.js';
import {StillApp} from '/src/still/app.ts';
import {stillImageStage} from '/src/still/media.ts';
import '/src/still/theme.css';

const style=document.createElement('style');style.textContent=css.replaceAll('still-app','media-layout-fixture');document.head.append(style);

 connectedCallback(){LitElement.prototype.connectedCallback.call(this);}
 updated(){}
 currentRouteProblem(){return '';}

 render(){return html`<div class=${this.panel?'still-layout has-developer':'still-layout'}><div class="still-shell"><header class="masthead"><a class="wordmark header-stamp" href="?scene=document">still<span>.</span></a></header><main>${this.scene==='pending'?stillImageStage(title,this.metadata,undefined,true):this.renderCanvas()}</main><div class="dock-stack"><footer class="action-dock"><en-toolbar label="Layout review"><en-button @click=${()=>window.draw({scene:'image'})}>Image</en-button><en-button @click=${()=>window.draw({scene:'document'})}>Document</en-button><en-button @click=${()=>window.draw({scene:'slides'})}>Slide</en-button></en-toolbar></footer></div></div>${this.panel?html`<aside class="developer-panel">Developer panel</aside>`:null}${new URL(location.href).searchParams.has('progress-report')?html`<a class="progress-return" href="http://127.0.0.1:4187">Progress Report</a>`:null}</div>`;}
