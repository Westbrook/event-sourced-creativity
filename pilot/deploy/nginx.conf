pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 client_body_temp_path /tmp/client-body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control 'private, no-store' always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ { return 404; } # Gateway routes /api directly to the verified Node boundary.
  location /protected-assets/ { return 404; }
  location /assets/ { try_files $uri =404; }
  location ~ ^/still(/action/new-project|/project/[A-Za-z0-9_-]+(/action/new-document|/ideas(/block/[A-Za-z0-9_-]+)?|/document/[A-Za-z0-9_-]+(/action/add-context|/block/[A-Za-z0-9_-]+)?)?)?/?$ { try_files /still.html =404; }
  location ~ ^/still(/project/[A-Za-z0-9_-]+(/ideas|/document/[A-Za-z0-9_-]+)?)?/page/[1-9][0-9]*/?$ { try_files /still.html =404; }
  location = /projects { try_files /index.html =404; }
  location ~ ^/document/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)?/?$ { try_files /index.html =404; }
  location / { return 404; }
 }
}
